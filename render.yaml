# Render Blueprint for the Arham Fintech take-home hosted evaluation deployment.
#
# One Free Docker Web Service + one Free PostgreSQL. ₹0 cost.
# NOTE: Free Render PostgreSQL expires after 30 days and the Free Web Service
# sleeps after ~15 minutes of inactivity (cold start ~1 min) — expected for a
# temporary hosted evaluation deployment, not permanent production.
#
# If DATABASE_URL is provided manually (from a locally-created Render Postgres),
# you can delete the `databases:` block below and set DATABASE_URL in envVars.

services:
  - type: web
    name: arham-fintech
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    # Migrate the schema, then run the idempotent production seed.
    preDeployCommand: npx prisma migrate deploy --schema apps/backend/prisma/schema.prisma && node apps/backend/dist/seed.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: BSE_DELAY_MS
        value: "50"
      - key: BSE_FAILURE_RATE
        value: "0.20"
      - key: BSE_SEED
        value: "12345"
      - key: MAX_RETRIES
        value: "3"
      - key: DATABASE_URL
        fromDatabase:
          name: arham-postgres
          property: connectionString

databases:
  - name: arham-postgres
    plan: free